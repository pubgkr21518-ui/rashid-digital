<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web Security Analyzer</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050709;
  color: #e8fff0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  font-size: 38px;
}

.subtitle {
  color: #8ca596;
}

textarea {
  width: 100%;
  min-height: 250px;
  margin-top: 20px;
  padding: 18px;
  background: #090d0b;
  color: #9affb7;
  border: 1px solid #1b5931;
  border-radius: 10px;
  font-family: monospace;
}

button {
  margin-top: 15px;
  padding: 13px 22px;
  border: 0;
  border-radius: 8px;
  cursor: pointer;
  background: #18c45b;
  color: #001b09;
  font-weight: bold;
}

.result {
  margin-top: 25px;
  padding: 20px;
  border: 1px solid #183b26;
  border-radius: 10px;
  background: #080c0a;
}

.check {
  padding: 12px 0;
  border-bottom: 1px solid #17231b;
}

.good {
  color: #58f28b;
}

.bad {
  color: #ff7070;
}
</style>
</head>

<body>

<div class="container">

  <p>CYBERFORGE / SECURITY TOOL</p>

  <h1>Web Security Analyzer</h1>

  <p class="subtitle">
    Analyze HTTP security headers and identify common defensive weaknesses.
  </p>

  <textarea id="headers" placeholder="Paste HTTP response headers here...

Example:

Content-Security-Policy: default-src 'self'
Strict-Transport-Security: max-age=31536000
X-Content-Type-Options: nosniff
X-Frame-Options: DENY
Referrer-Policy: strict-origin-when-cross-origin"></textarea>

  <button onclick="analyze()">Analyze Security</button>

  <div id="result" class="result">
    Results will appear here.
  </div>

</div>

<script>

const securityHeaders = [
  "content-security-policy",
  "strict-transport-security",
  "x-content-type-options",
  "x-frame-options",
  "referrer-policy",
  "permissions-policy"
];

function analyze() {

  const input = document
    .getElementById("headers")
    .value
    .toLowerCase();

  let score = 0;
  let output = "";

  securityHeaders.forEach(header => {

    if (input.includes(header)) {

      score++;

      output += `
        <div class="check good">
          ✓ ${header}
        </div>
      `;

    } else {

      output += `
        <div class="check bad">
          ✗ ${header} — Missing
        </div>
      `;

    }

  });

  const percentage =
    Math.round((score / securityHeaders.length) * 100);

  output =
    `<h2>Security Score: ${percentage}%</h2>` +
    output;

  document.getElementById("result").innerHTML = output;
}

</script>

</body>
</html>
