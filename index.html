/* =========================================
   NORMALIZE DEVICE NAME
========================================= */

function normalizeDevice(value){

    return value
        .toLowerCase()
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================
   FIND EXACT DEVICE
========================================= */

function findDevice(input){

    const normalized =
        normalizeDevice(input);

    return DEVICE_DATABASE.find(
        device =>
            normalizeDevice(device) === normalized
    );

}


/* =========================================
   GENERATE SENSITIVITY
========================================= */

function generateSensitivity(){

    const deviceInput =
        document
        .getElementById("device")
        .value
        .trim();

    const ram =
        document
        .getElementById("ram")
        .value;

    const storage =
        document
        .getElementById("storage")
        .value;

    const error =
        document
        .getElementById("error");


    /* EMPTY CHECK */

    if(
        !deviceInput ||
        !ram ||
        !storage
    ){

        error.textContent =
            "Please enter your device, RAM and storage.";

        error.style.display =
            "block";

        return;

    }


    /* EXACT DATABASE CHECK */

    const matchedDevice =
        findDevice(deviceInput);


    /* DEVICE NOT FOUND */

    if(!matchedDevice){

        error.innerHTML =
            `
            <strong>DEVICE NOT FOUND</strong><br>
            "${deviceInput}" is not currently available
            in the AimVanta FF device database.
            `;

        error.style.display =
            "block";

        return;

    }


    /* HIDE ERROR */

    error.style.display =
        "none";


    /* SAVE CANONICAL DEVICE NAME */

    const url =
        "sensitivity.html" +
        "?device=" +
        encodeURIComponent(matchedDevice) +
        "&ram=" +
        encodeURIComponent(ram) +
        "&storage=" +
        encodeURIComponent(storage);


    window.location.href =
        url;

}


/* =========================================
   ENTER KEY
========================================= */

document
    .getElementById("device")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                generateSensitivity();

            }

        }
    );


/* =========================================
   DEVICE AUTOCOMPLETE
========================================= */

const deviceInput =
    document.getElementById("device");


const suggestionBox =
    document.createElement("div");


suggestionBox.style.cssText = `
    position:absolute;
    left:0;
    right:0;
    top:100%;
    z-index:100;
    max-height:240px;
    overflow-y:auto;
    background:#07100d;
    border:1px solid rgba(25,255,120,.25);
    border-radius:12px;
    margin-top:6px;
    display:none;
    box-shadow:0 15px 40px rgba(0,0,0,.55);
`;


deviceInput.parentElement.style.position =
    "relative";


deviceInput.parentElement.appendChild(
    suggestionBox
);


deviceInput.addEventListener(
    "input",
    function(){

        const query =
            normalizeDevice(
                deviceInput.value
            );


        suggestionBox.innerHTML = "";


        if(query.length < 2){

            suggestionBox.style.display =
                "none";

            return;

        }


        const matches =
            DEVICE_DATABASE
            .filter(device =>
                normalizeDevice(device)
                .includes(query)
            )
            .slice(0,8);


        if(!matches.length){

            suggestionBox.innerHTML = `
                <div style="
                    padding:14px;
                    color:#ff5266;
                    font-size:13px;
                ">
                    Device not found
                </div>
            `;

            suggestionBox.style.display =
                "block";

            return;

        }


        matches.forEach(device => {

            const item =
                document.createElement("div");

            item.textContent =
                device;

            item.style.cssText = `
                padding:13px 15px;
                cursor:pointer;
                color:#d7e5df;
                border-bottom:1px solid
                rgba(255,255,255,.05);
                font-size:13px;
            `;


            item.addEventListener(
                "mouseenter",
                function(){

                    item.style.background =
                        "rgba(25,255,120,.08)";

                }
            );


            item.addEventListener(
                "mouseleave",
                function(){

                    item.style.background =
                        "transparent";

                }
            );


            item.addEventListener(
                "click",
                function(){

                    deviceInput.value =
                        device;

                    suggestionBox.style.display =
                        "none";

                }
            );


            suggestionBox.appendChild(item);

        });


        suggestionBox.style.display =
            "block";

    }
);


/* =========================================
   CLOSE AUTOCOMPLETE
========================================= */

document.addEventListener(
    "click",
    function(event){

        if(
            !deviceInput.contains(event.target) &&
            !suggestionBox.contains(event.target)
        ){

            suggestionBox.style.display =
                "none";

        }

    }
);


/* =========================================
   CODE RAIN
========================================= */

const canvas =
    document.getElementById("codeRain");

const ctx =
    canvas.getContext("2d");

let width;
let height;
let columns;
let drops;


function resizeCanvas(){

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

    columns =
        Math.floor(width / 18);

    drops =
        Array.from(
            {length:columns},
            () => Math.random() * -100
        );

}


function drawRain(){

    ctx.fillStyle =
        "rgba(0,0,0,.075)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    ctx.font =
        "13px monospace";


    const characters =
        "01ABCDEF<>/{}[]$#@";


    for(
        let i=0;
        i<drops.length;
        i++
    ){

        const char =
            characters[
                Math.floor(
                    Math.random() *
                    characters.length
                )
            ];


        ctx.fillStyle =
            "rgba(25,255,120,.45)";


        ctx.fillText(
            char,
            i * 18,
            drops[i] * 18
        );


        if(
            drops[i] * 18 > height &&
            Math.random() > .975
        ){

            drops[i] = 0;

        }


        drops[i] += .65;

    }


    requestAnimationFrame(drawRain);

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();
drawRain();
